<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طلبات البيت</title>
  <link rel="stylesheet" href="style.css">

  <!-- مكتبة إنشاء PDF للمشاركة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="topbar">
    <button id="themeToggle" type="button" aria-pressed="false">🌙 الوضع الليلي</button>
  </div>

  <main class="container">
    <h1>طلبات البيت</h1>
    <p class="subtitle">اكتبي الطلب والكمية وسعر الوحدة. يتم حفظ القائمة على هذا الجهاز تلقائيًا.</p>

    <div class="heading">
      <span>رقم</span>
      <span>الطلب</span>
      <span>الكمية</span>
      <span>سعر الوحدة</span>
    </div>

    <div id="items"></div>

    <div class="actions">
      <button id="createButton" type="button">إنشاء وطباعة PDF</button>
      <button id="shareButton" class="share-button" type="button">مشاركة PDF</button>
      <button id="clearButton" class="clear-button" type="button">مسح الكل</button>
    </div>
  </main>

  <!-- يجب تحميل الأسعار قبل كود الطلبات -->
  <script src="prices.js"></script>
  <script src="script.js"></script>
</body>
</html>

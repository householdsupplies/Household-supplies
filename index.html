
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PQR0WJHQHD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-PQR0WJHQHD');
  </script>

  <meta name="google-site-verification" content="EhETp-gC2O12hN2p9TXxNNstEFTf6fuPFiBI6bzRLTg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>طلبات البيت</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chatbot.css">

  <style>
    /* ترحيب الزائر - لا يغير تصميم الطلبات */
    #welcomeBar {
      display: none;
      margin: 0 auto 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #edf7ef;
      border: 1px solid #d3e9d7;
      color: #245b35;
      font-size: 15px;
      line-height: 1.7;
      text-align: right;
      overflow-wrap: anywhere;
    }

    #welcomeBar.visible {
      display: block;
    }

    #nameModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      padding: 18px;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
    }

    #nameModal.visible {
      display: flex;
    }

    .welcome-card {
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      padding: 24px;
      border-radius: 18px;
      background: #fff;
      color: #222;
      text-align: right;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      font-family: inherit;
    }

    .welcome-card h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .welcome-card p {
      margin: 0 0 18px;
      color: #666;
      line-height: 1.8;
      font-size: 14px;
    }

    #visitorName {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font: inherit;
      font-size: 16px;
      margin-bottom: 12px;
    }

    #saveVisitorName {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #287844;
      color: white;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    #saveVisitorName:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #nameError {
      display: none;
      margin: 0 0 10px;
      color: #b42318;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      #welcomeBar {
        padding: 10px 12px;
        font-size: 14px;
      }

      .welcome-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- تحية الزائر -->
  <div id="welcomeBar" role="status" aria-live="polite"></div>

  <!-- نافذة طلب الاسم -->
  <div
    id="nameModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="welcomeTitle"
  >
    <form class="welcome-card" id="visitorForm">
      <h2 id="welcomeTitle">أهلًا بيك 👋</h2>
      <p>نورت طلبات البيت! اكتب اسمك عشان نرحب بيك في زياراتك الجاية.</p>

      <label for="visitorName">اسمك</label>
      <input
        id="visitorName"
        type="text"
        maxlength="40"
        placeholder="اكتب اسمك هنا"
        autocomplete="given-name"
        required
      >

      <div id="nameError" role="alert"></div>

      <button id="saveVisitorName" type="submit">
        يلا نبدأ ❤️
      </button>
    </form>
  </div>

  <main class="container">
    <h1>طلبات البيت</h1>
    <p class="subtitle">اكتبي الطلب والكمية وسعر الوحدة. يظهر سطر جديد تلقائيًا.</p>

    <div class="heading">
      <span>رقم</span>
      <span>الطلب</span>
      <span>الكمية</span>
      <span>سعر الوحدة</span>
    </div>

    <div id="items"></div>

    <div class="actions">
      <button id="createButton" type="button">إنشاء وطباعة PDF</button>
      <button id="shareButton" class="share-button" type="button">مشاركة واتساب</button>
      <button id="clearButton" class="clear-button" type="button">مسح الكل</button>
    </div>
  </main>

  <!-- ملفات JavaScript الأصلية -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="script.js"></script>
  <script src="prices.js"></script>
  <script src="chatbot.js"></script>

  <!-- نظام الترحيب وحفظ الاسم -->
  <script>
    (function () {
      const STORAGE_KEY = 'householdSuppliesVisitorName';
      const modal = document.getElementById('nameModal');
      const form = document.getElementById('visitorForm');
      const nameInput = document.getElementById('visitorName');
      const welcomeBar = document.getElementById('welcomeBar');
      const error = document.getElementById('nameError');
      const saveButton = document.getElementById('saveVisitorName');

      function showWelcome(name) {
        welcomeBar.textContent = 'أهلًا بيك يا ' + name + ' ❤️ نورت طلبات البيت!';
        welcomeBar.classList.add('visible');
        modal.classList.remove('visible');
      }

      try {
        const savedName = localStorage.getItem(STORAGE_KEY);

        if (savedName && savedName.trim()) {
          showWelcome(savedName.trim());
        } else {
          modal.classList.add('visible');
          setTimeout(function () {
            nameInput.focus();
          }, 100);
        }
      } catch (e) {
        // لو التخزين غير متاح، يظل بإمكان الزائر إدخال اسمه.
        modal.classList.add('visible');
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const name = nameInput.value.trim();

        if (!name) {
          error.textContent = 'من فضلك اكتب اسمك الأول.';
          error.style.display = 'block';
          nameInput.focus();
          return;
        }

        saveButton.disabled = true;
        error.style.display = 'none';

        try {
          localStorage.setItem(STORAGE_KEY, name);
        } catch (e) {
          // نعرض التحية في الزيارة الحالية حتى لو تعذر الحفظ.
        }

        showWelcome(name);
        saveButton.disabled = false;
      });
    })();
  </script>

</body>
</html>


<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5e9">

  <title>طلبات البيت</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chatbot.css">

  <!-- مكتبة إنشاء PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <main class="container">

    <!-- الشريط العلوي -->
    <div class="topbar">
      <button
        id="chatToggle"
        class="chat-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="chatPanel">
        🤖 دردشة المساعد
      </button>

      <button
        id="themeToggle"
        type="button"
        aria-pressed="false">
        🌙 الوضع الليلي
      </button>
    </div>

    <!-- تحية الزائر -->
    <div id="welcomeBar" class="welcome-bar" hidden></div>

    <!-- نافذة إدخال الاسم أول زيارة -->
    <div id="welcomeModal" class="welcome-modal" hidden>
      <div class="welcome-modal-content">
        <h2>أهلًا بيك في طلبات البيت 👋</h2>
        <p>تحب نناديك بإيه في زياراتك الجاية؟</p>

        <form id="welcomeForm">
          <input
            id="visitorName"
            type="text"
            maxlength="40"
            placeholder="اكتب اسمك (اختياري)"
            autocomplete="given-name">

          <button type="submit">ابدأ الاستخدام</button>
        </form>

        <button id="skipWelcome" type="button">تخطي</button>
      </div>
    </div>

    <!-- نافذة الدردشة -->
    <section
      id="chatPanel"
      class="chat-panel"
      aria-label="مساعد طلبات البيت"
      hidden>

      <div class="chat-header">
        <div>
          <strong>🤖 مساعد طلبات البيت</strong>
          <small>اسألني عن الموقع والأسعار</small>
        </div>

        <button
          id="chatClose"
          class="chat-close"
          type="button"
          aria-label="إغلاق الدردشة">
          ×
        </button>
      </div>

      <div
        id="chatMessages"
        class="chat-messages"
        aria-live="polite">
        <div class="chat-message bot-message">
          أهلًا بيك! 😊 اكتب اسم منتج للبحث في الأسعار أو اسألني عن استخدام الموقع.
        </div>
      </div>

      <form id="chatForm" class="chat-form">
        <input
          id="chatInput"
          type="text"
          placeholder="اكتب رسالتك هنا..."
          autocomplete="off"
          required>

        <button type="submit">إرسال</button>
      </form>
    </section>

    <!-- عنوان الموقع -->
    <h1>طلبات البيت</h1>
    <p>نظّم طلبات المنزل والكميات والأسعار بسهولة.</p>

    <!-- الطلبات: حافظنا على المعرّف الذي يستخدمه script.js -->
    <div id="items"></div>

    <!-- أزرار الوظائف الأصلية -->
    <div class="actions">
      <button id="createButton" type="button">
        إنشاء وطباعة PDF
      </button>

      <button
        id="shareButton"
        class="share-button"
        type="button">
        مشاركة PDF
      </button>

      <button
        id="clearButton"
        class="clear-button"
        type="button">
        مسح الكل
      </button>
    </div>

  </main>

  <!-- تحميل الأسعار أولًا -->
  <script src="prices.js"></script>

  <!-- كود الطلبات الأصلي، لا تستبدله بكود الدردشة -->
  <script src="script.js"></script>

  <!-- كود الدردشة والترحيب -->
  <script src="chatbot.js"></script>

</body>
</html>
